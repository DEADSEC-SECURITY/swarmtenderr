# Optional initial client connection; otherwise configure it through Settings.
services:
  swarmtenderr:
    environment:
      QBITTORRENT_URL: ${QBITTORRENT_URL:?Set the client HTTP(S) origin}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-admin}
      QBITTORRENT_PASSWORD_FILE: /run/secrets/qbittorrent-password
    secrets: [qbittorrent-password]
secrets:
  qbittorrent-password:
    file: ${QBITTORRENT_PASSWORD_PATH:?Set the existing client password file path}
