name: swarmtenderr
services:
  swarmtenderr:
    image: ${SWARMTENDERR_IMAGE:-elgon2003/swarmtenderr:0.2.0}
    ports: ["127.0.0.1:8787:8787"]
    environment:
      SWARMTENDERR_PUBLIC_URL: ${SWARMTENDERR_PUBLIC_URL:-http://localhost:8787}
      SWARMTENDERR_DATABASE_URL: sqlite:////data/swarmtenderr.sqlite3
      SWARMTENDERR_PASSWORD_FILE: /run/secrets/admin-password
      SWARMTENDERR_CONFIG_FILE: /run/config/settings.json
      SWARMTENDERR_LOCKED_SETTINGS: ${SWARMTENDERR_LOCKED_SETTINGS:-}
    secrets: [admin-password]
    configs:
      - source: defaults
        target: /run/config/settings.json
    volumes: [state:/data]
    extra_hosts: ["host.docker.internal:host-gateway"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.50"
    restart: unless-stopped
secrets:
  admin-password:
    file: ${SWARMTENDERR_PASSWORD_PATH:?Set the initial administrator password file path}
configs:
  defaults:
    file: ${SWARMTENDERR_CONFIG_PATH:-./settings.defaults.json}
volumes:
  state:
